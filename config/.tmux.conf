unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 200000

set -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind v copy-mode
bind p paste-buffer

# Vim-like copy mode keys
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel


set -g alternate-screen off

# C-a e: 1/3 | 1/3 | 1/3
# Existing pane remains selected in the middle.
bind-key e \
  split-window -h -d -l 33% -c '#{pane_current_path}' \; \
  split-window -h -b -d -l 50% -c '#{pane_current_path}'

# C-a E: 1/4 | 1/2 | 1/4
# Existing pane remains selected in the larger middle section.
bind-key E \
  split-window -h -d -l 25% -c '#{pane_current_path}' \; \
  split-window -h -b -d -l 33% -c '#{pane_current_path}'

